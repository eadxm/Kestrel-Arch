name: Compile and Release Kestrel GUI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  release-binary:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust Stable & Build Dependencies
        run: |
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev

      - name: Build Kestrel GUI (Release Mode)
        run: |
          cd airootfs/gui-src
          cargo build --release

      - name: Prepare Release Asset
        run: |
          mkdir -p /tmp/release_asset
          cp airootfs/gui-src/target/release/kestrel-gui /tmp/release_asset/kestrel-gui
          chmod +x /tmp/release_asset/kestrel-gui

      - name: Publish to GitHub Releases with Automated Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Generate Tag
          RELEASE_TAG="build-$(date +'%Y.%m.%d-%H%M%S')"
          
          # 2. Extract Changelog focused strictly on GUI source modifications
          PREV_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          git config --global --add safe.directory '*' || true
          
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" -- airootfs/gui-src/ 2>/dev/null)
          else
            CHANGELOG=$(git log -5 --pretty=format:"- %s" -- airootfs/gui-src/ 2>/dev/null)
          fi
          
          [ -z "$CHANGELOG" ] && CHANGELOG="- Minor updates and stability improvements."
          
          # 3. Create the Release Notes Markdown file safely
          {
            echo "### 🚀 What's Improved or Fixed"
            echo "$CHANGELOG"
            echo ""
            echo "---"
            echo "*Automated build of the Kestrel Arch Slint GUI engine.*"
          } > release_notes.md
          
          # 4. Clean up old release
          if [ -n "$PREV_TAG" ]; then
            echo "=> Cleaning up old release: $PREV_TAG"
            gh release delete "$PREV_TAG" --yes --cleanup-tag 2>/dev/null || true
            git push origin --delete "$PREV_TAG" 2>/dev/null || true
          fi
          
          # 5. Create fresh GitHub Release using the generated notes
          echo "=> Creating fresh GitHub Release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --title "Kestrel GUI - Latest Build" \
            --notes-file release_notes.md \
            --latest \
            /tmp/release_asset/kestrel-gui
