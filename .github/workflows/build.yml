name: Build Kestrel Arch ISO (Offline)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'bootstrap'
      - 'bootstrap/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC

jobs:
  build-archiso:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      # FIX: Install Git BEFORE checking out, so the .git folder is actually downloaded!
      - name: Pre-Install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Build Dependencies (Including Rust)
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm
          
          # ADDED 'git' to the end of this list to enable changelog parsing
          pacman -S --noconfirm archiso wget gawk mtools dosfstools erofs-utils squashfs-tools pacman-contrib rustup base-devel cmake pkgconf freetype2 fontconfig libx11 libxkbcommon libxcb wayland openssh rsync github-cli git
          
          rustup default stable

      - name: Prepare Offline Package Cache & Dependencies
        run: |
          mkdir -p airootfs/opt/offline_cache
          mkdir -p /tmp/empty_db/local
          
          pacman-key --init
          
          pacman-key --recv-key 3056513887B78AEB --keyserver hkps://keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst' --noconfirm
          echo -e "\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist" >> /etc/pacman.conf

          pacman -Syw --cachedir airootfs/opt/offline_cache --dbpath /tmp/empty_db --noconfirm \
            base linux-cachyos linux linux-firmware scx-scheds switcheroo-control efibootmgr os-prober ntfs-3g networkmanager iwd bluez bluez-utils blueman \
            pipewire pipewire-pulse wireplumber brightnessctl xorg-server sddm sudo zram-generator earlyoom \
            reflector ttf-dejavu ttf-liberation noto-fonts noto-fonts-emoji curl chaotic-keyring chaotic-mirrorlist parted btrfs-progs dosfstools e2fsprogs xfsprogs gparted \
            amd-ucode intel-ucode nvidia nvidia-utils nvidia-prime xf86-video-amdgpu intel-media-driver \
            grub refind limine \
            hyprland waybar kitty rofi-wayland xdg-desktop-portal-hyprland polkit-kde-agent thunar gvfs \
            plasma-desktop plasma-workspace plasma-nm power-profiles-daemon kscreen konsole dolphin sddm-kcm \
            xfce4 xfce4-terminal xfce4-goodies falkon \
            qt5-wayland qt6-wayland git stow cage mesa polkit

      - name: Index Offline Database
        run: |
            cd airootfs/opt/offline_cache
            repo-add kestrel-offline.db.tar.gz *.pkg.tar.zst

      - name: Build Kestrel GUI
        run: |
          mkdir -p airootfs/gui-src/ui/fonts
          cp Geomini.ttf airootfs/gui-src/ui/fonts/ 2>/dev/null || true
          cp CascadiaCode.ttf airootfs/gui-src/ui/fonts/ 2>/dev/null || true
          
          cd airootfs/gui-src
          cargo build --release

      - name: Build the ISO
        run: |
          cp -r /usr/share/archiso/configs/releng /tmp/kestrel_profile
          echo -e "\n[chaotic-aur]\nSigLevel = Optional TrustAll\nInclude = /etc/pacman.d/chaotic-mirrorlist" >> /tmp/kestrel_profile/pacman.conf
          
          # FIX: Added the missing 'n' for ntfs-3g, plus the missing chaotic keys
          echo -e "zsh\ncage\nkitty\nmesa\nttf-dejavu\npolkit\npciutils\nxorg-xwayland\nparted\nbtrfs-progs\ndosfstools\nntfs-3g\ne2fsprogs\nxfsprogs\ngparted\nchaotic-keyring\nchaotic-mirrorlist" >> /tmp/kestrel_profile/packages.x86_64

          mkdir -p /tmp/kestrel_profile/airootfs/usr/local/bin
          mkdir -p /tmp/kestrel_profile/airootfs/root
          
          sed 's/\r$//' airootfs/usr/local/bin/install.sh > /tmp/kestrel_profile/airootfs/usr/local/bin/install.sh
          cp airootfs/gui-src/target/release/kestrel-gui /tmp/kestrel_profile/airootfs/usr/local/bin/kestrel-gui
          
          # Renames the ISO file output to Kestrel-Arch(offline)-YYYY-MM-DD-x86_64.iso
          sed -i 's/^iso_name=.*/iso_name="Kestrel-Arch(offline)"/' /tmp/kestrel_profile/profiledef.sh
          
          sed -i '/file_permissions=(/a \  ["/usr/local/bin/install.sh"]="0:0:755"\n  ["/usr/local/bin/kestrel-gui"]="0:0:755"' /tmp/kestrel_profile/profiledef.sh
          
          sed -i 's/^compressor=.*/compressor="zstd"/' /tmp/kestrel_profile/profiledef.sh

          # FIX: Replaced EOF with safe echo block to prevent YAML parser errors
          {
            echo 'export XDG_RUNTIME_DIR=/run/user/$(id -u)'
            echo 'export WLR_NO_HARDWARE_CURSORS=1'
            echo 'export WLR_RENDERER_ALLOW_SOFTWARE=1'
            echo 'IS_VM=$(systemd-detect-virt -q && echo 1 || echo 0)'
            echo 'HAS_NVIDIA=$(lspci | grep -iE "vga.*nvidia|3d.*nvidia" >/dev/null 2>&1 && echo 1 || echo 0)'
            echo 'if [ "$IS_VM" = "1" ] || [ "$HAS_NVIDIA" = "1" ]; then'
            echo '    export WLR_RENDERER=pixman'
            echo 'fi'
            echo 'if [ "$(tty)" = "/dev/tty1" ]; then'
            echo '    exec cage -s -- /usr/local/bin/kestrel-gui'
            echo 'fi'
          } > /tmp/kestrel_profile/airootfs/root/.zlogin

          mkdir -p /tmp/kestrel_profile/airootfs/opt
          cp -r airootfs/opt/offline_cache /tmp/kestrel_profile/airootfs/opt/

          mkdir -p out/
          mkarchiso -v -w /tmp/archiso-tmp -o out/ /tmp/kestrel_profile/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kestrel-Arch-ISO-Offline
          path: out/*.iso

      # FIX: Automatically squashes git/LFS history on every run to prevent storage bloat
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          echo "=> Preparing ISO for Hugging Face deployment..."
          ISO_FILE=$(ls out/*.iso 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO file found in out/"
            exit 1
          fi
          
          ISO_NAME=$(basename "$ISO_FILE")
          
          echo "=> Setting up Git LFS and cloning Hugging Face Dataset repository..."
          git lfs install
          git clone https://user:$HF_TOKEN@huggingface.co/datasets/$HF_REPO hf_dataset
          cd hf_dataset
          
          git config user.name "Kestrel Bot"
          git config user.email "actions@users.noreply.github.com"
          
          # Remove old ISO files to ensure a clean slate
          rm -f *.iso
          
          # Copy the fresh ISO into the dataset folder
          cp ../$ISO_FILE ./
          
          # Ensure Git LFS tracks ISO files
          git lfs track "*.iso"
          git add .gitattributes
          
          # Create an orphan branch to completely squash prior history and purge old LFS bloat
          git checkout --orphan fresh_branch
          git add "$ISO_NAME" .gitattributes README.md 2>/dev/null || git add "$ISO_NAME" .gitattributes
          git commit -m "Automated ISO deployment: $ISO_NAME [skip ci]"
          
          # Replace main branch with the clean squashed branch and force push
          git branch -D main 2>/dev/null || true
          git branch -m main
          git push origin main --force
          
          echo "=> Hugging Face deployment and history reset successful!"

      - name: Create or Update Rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          ISO_FILE=$(basename $(ls out/*.iso 2>/dev/null | head -n 1))
          
          # Generates the direct download link from your Hugging Face Dataset
          DOWNLOAD_URL="https://huggingface.co/datasets/${HF_REPO}/resolve/main/${ISO_FILE}?download=true"
          RELEASE_TAG="latest-iso"
          
          git config --global --add safe.directory '*' || true
          
          # FIX: Only parses commits that actually modified the GUI or installer backend
          CHANGELOG=$(git log -10 --pretty=format:"- %s" -- airootfs/ 2>/dev/null)
          [ -z "$CHANGELOG" ] && CHANGELOG="- Routine updates and maintenance."
          
          {
            echo "### 🦅 Kestrel Arch - Latest Deployment (Offline Installer)"
            echo ""
            echo "**Note:** ISO is hosted on our high-speed Hugging Face CDN for maximum download speeds."
            echo "✅ **[Download $ISO_FILE Here]($DOWNLOAD_URL)**"
            echo ""
            echo "### 🚀 What's Improved or Fixed"
            echo "$CHANGELOG"
            echo ""
            echo "---"
            echo "*Updated automatically via GitHub Actions.*"
          } > release_notes.md
          
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "=> Updating existing release: $RELEASE_TAG"
            
            # FIX: Force push tag without deleting, and ensure draft=false
            git tag -f "$RELEASE_TAG"
            git push origin "$RELEASE_TAG" --force
            
            gh release edit "$RELEASE_TAG" \
              --title "Kestrel Arch Latest Offline ISO" \
              --notes-file release_notes.md \
              --draft=false
          else
            echo "=> Creating rolling release: $RELEASE_TAG"
            
            # FIX: Added forced git tag override here too, protecting against the exit 128 error!
            git tag -f "$RELEASE_TAG"
            git push origin "$RELEASE_TAG" --force
            
            gh release create "$RELEASE_TAG" \
              --title "Kestrel Arch Latest Offline ISO" \
              --notes-file release_notes.md \
              --latest
          fi
